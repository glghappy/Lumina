group=org.leavesmc.lumina
mcVersion=26.3
apiVersion=26.3
clipVersion=3.0.10
weightVersion=1.0.2

# === Lumina version stage ===
# Stage values: alpha | beta | rc | release
#   alpha  - early development, incomplete features
#   beta   - feature-complete, testing phase
#   rc     - release candidate, bug fixes only
#   release - stable public release (omitted from version string)
luminaStage=release
luminaBuildNum=1

# === Paperweight/Fill build channel ===
# Values: ALPHA | BETA | SNAPSHOT
channel=BETA

# === Release automation ===
# true for release, false for skip release, pre for pre-release
release=pre
# true for push to repo, false for skip push repo, auto for detect by release value
pushRepo=auto

foliaRef=597e41371802648e0455fc1571192ee1c83fca2b
paperRef=c927bd34ab4b544cc125367ea62c7ea2f1a2196d

org.gradle.configuration-cache=false
org.gradle.configuration-cache.strict-implicit-dependency=false
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.jvmargs=-Xmx4G
